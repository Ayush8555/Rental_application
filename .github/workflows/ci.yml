name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16.10-bookworm
        env:
          POSTGRES_USER: rentnook
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: rentnook_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rentnook" --health-interval 5s --health-retries 10
      redis:
        image: redis:7.4.6-alpine
        ports: ["6379:6379"]
    env:
      TEST_DATABASE_URL: postgresql://rentnook:ci-only-password@localhost:5432/rentnook_test
      DATABASE_URL: postgresql://rentnook:ci-only-password@localhost:5432/rentnook_test
      REDIS_URL: redis://localhost:6379/5
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22.23.5
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:cov
      - run: npm audit --omit=dev --audit-level=high

  admin:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22.23.5
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  app:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: subosito/flutter-action@v2.21.0
        with:
          flutter-version: 3.50.1
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - name: Gitleaks (secrets)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 \
            git /repo --config /repo/.gitleaks.toml --redact --exit-code 1
      - name: Semgrep (OWASP rules)
        run: |
          docker run --rm -v "$PWD:/src" semgrep/semgrep:1.140.0 \
            semgrep scan --config p/owasp-top-ten --config p/typescript --config p/secrets \
            --severity ERROR --error --exclude node_modules --exclude src/generated /src
