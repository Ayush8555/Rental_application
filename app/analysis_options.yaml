include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    avoid_print: error
    # Flutter 3.47 split material/cupertino into their own packages. The old
    # imports still work; the move is a separate change once plugins catch up.
    deprecated_member_use: ignore
  exclude:
    - build/**
    - android/**
    - ios/**

linter:
  rules:
    - prefer_const_constructors
    - prefer_final_locals
    - avoid_dynamic_calls
    - unawaited_futures
    - use_build_context_synchronously
