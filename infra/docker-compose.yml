# One server per environment (staging, production). Only Caddy is reachable
# from outside; Postgres and Redis sit on the private network.
#
#   cp infra/.env.example infra/.env   # fill in on the server, chmod 600
#   docker compose -f infra/docker-compose.yml --env-file infra/.env up -d

name: rentnook

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "10" }

services:
  caddy:
    <<: *hardening
    build:
      context: ../admin
      args:
        VITE_API_URL: https://${API_HOST}
    image: rentnook-edge
    cap_add: [NET_BIND_SERVICE]
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      API_HOST: ${API_HOST}
      ADMIN_HOST: ${ADMIN_HOST}
      WWW_HOST: ${WWW_HOST}
      ACME_EMAIL: ${ACME_EMAIL}
      ADMIN_ALLOW_IPS: ${ADMIN_ALLOW_IPS:-0.0.0.0/0 ::/0}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/extra:/etc/caddy/extra:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [api]
    networks: [edge]

  api:
    <<: *hardening
    build: ../backend
    image: rentnook-api
    env_file: ./api.env
    environment:
      TRUST_PROXY: "true"
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    deploy:
      resources: { limits: { cpus: "1.5", memory: 1g } }
    networks: [edge, private]

  worker:
    <<: *hardening
    image: rentnook-api
    command: ["node", "dist/worker.js"]
    env_file: ./api.env
    read_only: true
    tmpfs: [/tmp]
    depends_on: [api]
    deploy:
      resources: { limits: { cpus: "1", memory: 768m } }
    networks: [private]

  postgres:
    <<: *hardening
    image: postgres:16.10-bookworm
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    environment:
      POSTGRES_DB: rentnook
      POSTGRES_USER: rentnook_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_owner_password
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    secrets: [pg_owner_password, pg_app_password]
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./postgres/roles.sql:/docker-entrypoint-initdb.d/10-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rentnook_owner -d rentnook"]
      interval: 10s
      retries: 6
    networks: [private]

  redis:
    <<: *hardening
    image: redis:7.4.6-alpine
    cap_add: [SETGID, SETUID]
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "yes"
      # Commands nobody in the app needs and an attacker would love.
      - --rename-command
      - FLUSHALL
      - ""
      - --rename-command
      - CONFIG
      - ""
      - --rename-command
      - DEBUG
      - ""
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep PONG"]
      interval: 10s
      retries: 6
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [private]

secrets:
  pg_owner_password:
    file: ./secrets/pg_owner_password
  pg_app_password:
    file: ./secrets/pg_app_password

volumes:
  caddy-data:
  caddy-config:
  pg-data:
  redis-data:

networks:
  edge:
  private:
    internal: true
